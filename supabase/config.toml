# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
#
# =============================================================================
# READ THIS BEFORE ADDING A LINE TO THIS FILE
#
#   EVERY PROPERTY DECLARED HERE IS WRITTEN TO THE HOSTED PROJECT BY
#   `supabase config push`. PROPERTIES THIS FILE DOES NOT DECLARE ARE LEFT
#   UNCHANGED.
#
# That is the CLI's own contract (`supabase config push --help`), and it makes
# this file's SILENCE as meaningful as its contents. A value present only
# because `supabase init`'s template wrote it is not a neutral default — it is
# an instruction to overwrite whatever the production project currently has.
#
# This file was stripped for exactly that reason. As generated, it declared
# fifteen properties that differed from the hosted project, of which thirteen
# were accidents of the template: a `127.0.0.1` site URL and redirect
# allow-list, e-mail confirmation and OTP behaviour, MFA and Twilio toggles,
# connection-pooler sizing, and storage settings. Pushing it would have
# reconfigured a production auth service to point at a developer's laptop.
#
# So the rule for this file is:
#
#   DECLARE IT ONLY IF YOU INTEND TO GOVERN IT ON THE HOSTED PROJECT,
#   OR IF IT IS LOCAL-ONLY AND NEVER COMPARED.
#
# `supabase config diff` reports a `declared` flag per difference. Before any
# push, the only entries with `declared: true` must be ones you meant.
#
# LOCAL-ONLY, VERIFIED: `api.port`, `api.tls`, `api.auto_expose_new_tables`,
# every `db.*` port/version/migration/seed key, `db.pooler.enabled`,
# `realtime.enabled`, `storage.enabled`, `analytics.enabled`, `studio.*`,
# `local_smtp.*`, `edge_runtime.*` and `functions.*` are not part of the config
# comparison at all — they were probed by flipping each one and re-running
# `config diff`. Setting them costs the hosted project nothing.
#
# WHEN LOCAL AND HOSTED MUST GENUINELY DIFFER on a governed property — the
# first real case will be `auth.site_url` once a web client is deployed — the
# supported mechanism is a remote-scoped override block, confirmed working on
# this pinned CLI:
#
#   [remotes.pilot]
#   project_id = "<project-ref>"
#
#   [remotes.pilot.auth]
#   site_url = "https://the-real-origin.example"
#
# `config diff` then reports `using [remotes.pilot]` and the override replaces
# the base value for that project. It is an override ON TOP OF the base, not a
# replacement for it, so a base declaration still reaches the hosted project
# unless the remote block overrides it — stripping the base is still the
# load-bearing step.
# =============================================================================

# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "LandedCompare"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API.
#
# THIS IS A SECURITY CONTROL, NOT A PREFERENCE.
# Cloud & Multi-User Architecture §7 and §20: `api` is the only business schema
# PostgREST is allowed to route. The canonical tables live in `app_data` and the
# security helpers in `app_private`, and neither has an HTTP route as a result —
# which is what makes the exact-decimal contract (§10) and the stale-write
# guarantee (§9) server properties rather than client conventions.
#
# `public` is deliberately absent: it is an exposed schema by Supabase default
# and holds no LandedCompare business object. `graphql_public` is absent because
# this product has no GraphQL surface and an unused route is still a route.
#
# The hosted project's "Exposed schemas" setting must match this list, and the
# behavioural suite asserts it over HTTP rather than trusting it (B4/B5/B8).
schemas = ["api"]
# Extra schemas to add to the search_path of every request. A search path is not
# an exposure: it lets extension functions resolve and creates no route.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Supabase's default is `true`: an event trigger grants the Data API roles
# access to new objects in `public` without an explicit GRANT. §7 requires the
# opposite posture — every privilege explicit, per object, in the migration that
# creates it — so the convenience is switched off rather than relied upon not to
# matter because `public` is empty.
auto_expose_new_tables = false

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
# How many server connections to allow per user/database pair.
# Maximum number of client connections allowed.

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[realtime]
enabled = false
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Not used. §3: no attachments, photos or documents are in scope.
[storage]
enabled = false
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Public sign-up is DISABLED (§4). Accounts exist only because an administrator
# created one through `admin-provision-user`. Without this, anyone holding the
# publishable key could create an `auth.users` row; such a principal would have
# no membership and therefore no business access, but "they cannot do anything
# anyway" is not a control this architecture is willing to lean on.
enable_signup = false
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`

# Configure passkey sign-ins.
[auth.email]
# Left ENABLED, and the reason is not an oversight.
#
# This key does not mean what its name suggests. The CLI maps it to GoTrue's
# `GOTRUE_EXTERNAL_EMAIL_ENABLED`, which turns the e-mail provider off
# ENTIRELY — including sign-IN. Setting it to `false` produces
# `422 email_provider_disabled` on every password login, which for a product
# whose only authentication method is e-mail and password means nobody can use
# it at all.
#
# Public registration is closed by `[auth] enable_signup = false` above
# (GoTrue's `DISABLE_SIGNUP`), which refuses `POST /auth/v1/signup` while
# leaving `POST /auth/v1/token?grant_type=password` working. The behavioural
# suite asserts both halves of that sentence rather than trusting either.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
# If enabled, users need to confirm their email address before signing in.
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
# Number of characters used in the email OTP.
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
[functions.admin-provision-user]
enabled = true
verify_jwt = true

# `admin-reset-password` was removed in Phase 12 (P12-B1): an organisation
# administrator must not replace the password of a global Auth identity.

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# Edge Function secrets are the ONLY place a secret key exists (§19). They are
# never written to a file in this repository: locally the runtime is handed the
# local stack's own throwaway key automatically, and on the hosted project they
# are set once with `supabase secrets set`, out of band.
# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

# Local log aggregation. Not part of the product: §21 requires audit to live in
# the database (`admin_events`) rather than in platform logs, which the Free plan
# retains for one day anyway.
[analytics]
enabled = false
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
